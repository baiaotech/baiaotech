<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Exemplo visual — Agenda diária sem evento confirmado hoje</title>
  <desc id="desc">Referência de composição para destacar o próximo encontro cadastrado sem faixa improvisada no topo. Fallback atualizado para remover o marcador DIÁRIO do rodapé.</desc>
