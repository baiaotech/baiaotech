name: Validate publication repair (temporary)

on:
  push:
    branches:
      - fix/restore-site-publication-20260918
    paths:
      - .github/workflows/repair-publication-once.yml

permissions:
  contents: write

concurrency:
  group: repair-publication-20260918
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  repair-and-test:
    if: github.repository == 'baiaotech/baiaotech'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/restore-site-publication-20260918

      - name: Setup supported Node.js LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Verify clean locked installation
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild esbuild
          npm ls vitest @vitest/coverage-v8

      - name: Optimize oversized verified JPEG using bounded scaled decoding
        run: |
          set -eu
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 --max-filesize 15000000 'https://static.even3.com/banner/WITE26_Backdrop_page-0001.24d31f3a665b42c397b6.jpg' -o "$RUNNER_TEMP/wite-original.jpg"
          printf '%s  %s\n' '3ecfd4a7b041a72f2b514019cd577662fd00ec2b5a55ac30fdebd46ab994951f' "$RUNNER_TEMP/wite-original.jpg" | sha256sum --check
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil > "$RUNNER_TEMP/pillow-install.log"
          /usr/bin/python3 <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          # Only the exact, hashed official JPEG is allowed past this larger header limit.
          # JPEG draft decoding reduces pixel allocation before loading the source image.
          Image.MAX_IMAGE_PIXELS = 400_000_000
          source = Path(os.environ['RUNNER_TEMP']) / 'wite-original.jpg'
          with Image.open(source) as image:
              assert image.format == 'JPEG' and image.mode == 'RGB' and image.size == (23623, 14764)
              print('Original JPEG:', image.size, flush=True)
              image.draft('RGB', (1600, 1600))
              assert image.width * image.height < 6_000_000
              print('Bounded JPEG decode:', image.size, flush=True)
              image.load()
              image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
              target = Path('src/assets/covers/events/wite-natal-2026.jpg')
              target.parent.mkdir(parents=True, exist_ok=True)
              image.save(target, format='JPEG', quality=88, optimize=True)
              assert image.size == (1600, 1000)
              assert 100 < target.stat().st_size < 250000
              print('Optimized official image:', image.size, target.stat().st_size, flush=True)
          event = Path('src/content/events/wite-natal-2026.md')
          text = event.read_text()
          old = 'cover_image: "https://images.even3.com/dQC2Mfi72TQO5ome2DgYCZQuDpE=/1100x440/smart/https://static.even3.com/banner/WITE26_Backdrop_page-0001.24d31f3a665b42c397b6.jpg"'
          assert text.count(old) == 1
          replacement = '# Copia local otimizada da capa oficial, sem recorte: https://static.even3.com/banner/WITE26_Backdrop_page-0001.24d31f3a665b42c397b6.jpg\ncover_image: "/assets/covers/events/wite-natal-2026.jpg"'
          event.write_text(text.replace(old, replacement))
          PY

      - name: Validate content, unit tests, coverage and production build
        env:
          SITE_URL: https://baiaotech.org
          PATH_PREFIX: /
        run: |
          npm run validate
          npm run test:unit
          npm run test:coverage
          npm run build > "$RUNNER_TEMP/build-production.log"

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium > "$RUNNER_TEMP/install-browser.log" 2>&1 || { tail -n 50 "$RUNNER_TEMP/install-browser.log"; exit 1; }

      - name: Run existing smoke E2E suite unchanged
        run: npm run test:e2e > "$RUNNER_TEMP/e2e.log" 2>&1 || { tail -n 150 "$RUNNER_TEMP/e2e.log"; exit 1; }

      - name: Show E2E summary
        run: tail -n 25 "$RUNNER_TEMP/e2e.log"

      - name: Preserve browser-validated cover on isolated branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/content/events/wite-natal-2026.md src/assets/covers/events/wite-natal-2026.jpg
          git diff --cached --check
          git commit -m 'fix(media): serve browser-compatible official WITE cover locally'
          git push origin HEAD:refs/heads/fix/restore-site-publication-20260918
          git rev-parse HEAD

      - name: Preserve validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-repair-validation
          retention-days: 1
          if-no-files-found: ignore
          path: |
            package.json
            package-lock.json
            src/content/events/wite-natal-2026.md
            src/assets/covers/events/wite-natal-2026.jpg
            coverage/lcov.info
            output/playwright
